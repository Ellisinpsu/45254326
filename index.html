<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奶茶社区</title>

<style>

body{
    background:#f7f7f7;
    font-family:"Microsoft YaHei",sans-serif;
    margin:0;
}

header{
    background:white;
    padding:15px 20px;
    position:sticky;
    top:0;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1{
    margin:0;
    color:#8B5E3C;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:20px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.post{
    background:white;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.content{
    padding:10px 12px;
}

.user{
    color:#666;
    font-size:14px;
}

.title{
    font-size:16px;
    font-weight:600;
    margin:8px 0;
}

.desc{
    color:#555;
}

.action{
    margin-top:10px;
    color:#888;
}

</style>
</head>

<body>

<header>
    <h1>🧋奶茶社区</h1>
</header>

<div class="container">

    <div class="post">

        <img src="https://images.unsplash.com/photo-1558857563-b371033873b8?w=1200">

        <div class="content">

            <div class="user">
                👤 奶茶研究员
            </div>

            <div class="title">
                喜茶多肉葡萄测评
            </div>

            <div class="desc">
                果肉很多，推荐三分糖，夏天喝真的很爽。
            </div>

            <div class="action">
                ❤️ 128 &nbsp;&nbsp; 💬 36
            </div>

        </div>

    </div>

    <div class="post">

        <img src="https://images.com/photo-1513558161293-cdaf765ed2fd?w=1200">

        <div class="content">

            <div class="user">
                👤 茶饮爱好者
            </div>

            <div class="title">
                霸王茶姬伯牙绝弦值得买吗？
            </div>

            <div class="desc">
                茶香很浓，不会特别甜，适合喜欢茶味重的人。
            </div>

            <div class="action">
                ❤️ 212 &nbsp;&nbsp; 💬 67
            </div>

        </div>

    </div>

</div>

</body>
</html>
